<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto - La Salle</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

    <main class="contenedor">
        <section class="tarjeta">
            <h1>Formulario de contacto</h1>
            <p class="subtitulo">Universidad de La Salle</p>

            <form id="contactoForm" novalidate>
                <div class="grid-campos">

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre"
                               placeholder="Introducir nombre aquí"
                               maxlength="100">
                        <span class="error-campo" id="error-nombre"></span>
                    </div>

                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo"
                               placeholder="Introducir correo electrónico aquí">
                        <span class="error-campo" id="error-correo"></span>
                    </div>

                    <div class="campo campo-full">
                        <label for="asunto">Asunto</label>
                        <input type="text" id="asunto" name="asunto"
                               placeholder="Introducir asunto aquí"
                               maxlength="150">
                        <span class="error-campo" id="error-asunto"></span>
                    </div>

                    <div class="campo campo-full">
                        <div class="campo-contador">
                            <label for="mensaje">Mensaje</label>
                            <span class="contador" id="contadorMensaje">0 / 500</span>
                        </div>
                        <textarea id="mensaje" name="mensaje" rows="6"
                                  placeholder="Introducir mensaje aquí"
                                  maxlength="500"></textarea>
                        <span class="error-campo" id="error-mensaje"></span>
                    </div>

                </div>

                <button type="submit" id="btnEnviar">
                    <span class="spinner"></span>
                    <span class="btn-texto">Enviar mensaje</span>
                </button>

                <p id="mensajeResultado"></p>

            </form>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
